<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Actualizar Brújula</title><style>body{margin:0;background:#f4f7f7;color:#142c39;font-family:system-ui,'Segoe UI',Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box}.box{max-width:550px;background:white;border:1px solid #dbe6e7;padding:28px;border-radius:20px;box-shadow:0 10px 40px #173e5310}h1{font-size:1.5rem;margin:0 0 12px}p{line-height:1.65}.note{font-size:.9rem;color:#48636f}.links{display:flex;gap:12px;flex-wrap:wrap}a,button{border:0;background:#087e79;color:#fff;text-decoration:none;font-weight:650;padding:12px 16px;border-radius:10px;cursor:pointer}.minor{background:#e8f3f1;color:#125c58}</style></head><body><main class="box"><h1>Actualizando Brújula…</h1><p id="status" role="status">Comprobando la versión nueva antes de abrir tu horario.</p><p class="note">Tus cursos, horarios y avances no se borrarán. Esta página solo limpia archivos temporales de la aplicación.</p><div class="links"><button onclick="location.reload()">Volver a intentar</button><a class="minor" href="./brujula-actualizada.html?v=350">Abrir versión 3.3.1</a></div></main><script>(async()=>{const status=document.getElementById('status');try{const path='./brujula-actualizada.html?comprobar=350';const response=await fetch(path,{cache:'no-store'});if(!response.ok)throw Error('La versión nueva todavía no se ha publicado (HTTP '+response.status+'). Espera 2 minutos e intenta de nuevo.');const html=await response.text();if(!html.includes('BRUJULA-VERSION-3.5'))throw Error('GitHub Pages todavía está mostrando una versión antigua. Espera unos minutos y vuelve a intentar.');status.textContent='Versión 3.3.1 encontrada. Limpiando archivos antiguos...';if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.startsWith(new URL('./',location.href).href)).map(r=>r.unregister().catch(()=>{})))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('brujula-offline-')).map(k=>caches.delete(k).catch(()=>{})))}status.textContent='Listo. Abriendo tu horario nuevo...';location.replace('./brujula-actualizada.html?v=350&actualizado=1')}catch(err){status.textContent=err.message||'No se pudo actualizar. Reintenta en unos minutos.'}})();</script></body></html>
