<!doctype html>
<html lang="es-PE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actualizar Brújula</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box;background:#F5F6F1;color:#1B2421;font:16px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){body{background:#101614;color:#E8EDE9}.box{background:#171F1C!important;border-color:#28322E!important}}
.box{max-width:520px;background:#fff;border:1px solid #DFE3DA;padding:28px;border-radius:22px}
h1{font-size:1.5rem;margin:0 0 10px}.note{opacity:.75;font-size:.92rem}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
a,button{border:0;background:#A3157A;color:#fff;text-decoration:none;font:inherit;font-weight:650;padding:12px 16px;border-radius:12px;cursor:pointer}
.minor{background:transparent;color:inherit;border:1px solid #C9CFC4}
</style></head>
<body><main class="box">
<h1>Actualizando Brújula…</h1>
<p id="status" role="status">Comprobando la versión publicada.</p>
<p class="note">Tus cursos, horarios, avances y notas de voz <b>no se borran</b>: esta página solo renueva los archivos de la aplicación guardados en el navegador.</p>
<div class="links"><button type="button" onclick="location.reload()">Volver a intentar</button><a class="minor" href="./index.html">Abrir Brújula</a></div>
</main>
<script>
(async () => {
  const status = document.getElementById('status');
  try {
    const res = await fetch('./index.html?comprobar=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw Error('La versión nueva aún no está publicada (HTTP ' + res.status + '). Espera 2 minutos.');
    const html = await res.text();
    const m = html.match(/BRUJULA-VERSION-([\d.]+)/);
    if (!m) throw Error('GitHub Pages todavía muestra una versión antigua. Espera unos minutos.');
    status.textContent = 'Versión ' + m[1] + ' encontrada. Renovando archivos…';
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter((r) => r.scope.startsWith(new URL('./', location.href).href)).map((r) => r.unregister().catch(() => {})));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.filter((k) => k.startsWith('brujula-offline-') || k.startsWith('brujula-app-v')).map((k) => caches.delete(k).catch(() => {})));
    }
    status.textContent = 'Listo. Abriendo Brújula ' + m[1] + '…';
    location.replace('./index.html?v=' + m[1] + '&actualizado=1');
  } catch (err) { status.textContent = err.message || 'No se pudo actualizar. Reintenta en unos minutos.'; }
})();
</script>
</body></html>
